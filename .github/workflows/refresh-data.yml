name: Daily Data Refresh

on:
  schedule:
    # 1:00 AM UTC = 9:00 AM HKT
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Write credential files
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN }}' > token.json
          echo '${{ secrets.IG_TOKEN }}' > ig_token.json
          echo '${{ secrets.THREADS_TOKEN }}' > threads_token.json
          echo '${{ secrets.CLIENT_SECRET }}' > client_secret.json
          if [ -n "$SHEETS_TOKEN" ]; then
            printf '%s' "$SHEETS_TOKEN" > sheets_token.json
            echo "sheets_token.json written — episodes/videos refresh enabled"
          else
            echo "SHEETS_TOKEN secret not set — skipping episodes refresh"
          fi

      - name: Fetch YouTube Analytics
        run: python3 fetch_analytics.py

      - name: Fetch Instagram
        run: python3 fetch_instagram.py
        continue-on-error: true

      - name: Fetch Threads
        run: python3 fetch_threads.py
        continue-on-error: true

      - name: Fetch Episodes (Google Sheets)
        run: |
          if [ -f sheets_token.json ]; then
            python3 fetch_episodes.py
          else
            echo "Skipped: sheets_token.json missing"
          fi
        continue-on-error: true

      - name: Fetch Videos
        run: python3 fetch_videos.py
        continue-on-error: true

      - name: Verify freshness
        run: |
          python3 - <<'PY'
          import json, os, sys, time
          from datetime import date, timezone, datetime
          today = date.today().isoformat()
          warnings = []
          if os.path.exists("data/episodes.json"):
              ep = json.load(open("data/episodes.json"))
              fetched = ep.get("fetched_at", "")
              if not fetched.startswith(today):
                  warnings.append(f"data/episodes.json fetched_at={fetched!r}, expected {today}")
          for path in ("data/videos.json", "data/analytics.json", "data/instagram.json", "data/threads.json"):
              if os.path.exists(path):
                  age = time.time() - os.path.getmtime(path)
                  if age > 1800:
                      warnings.append(f"{path} mtime {int(age)}s old (>30min) — fetcher likely failed")
          if warnings:
              print("::warning::Freshness check found stale files:")
              for w in warnings:
                  print(f"::warning::  - {w}")
          else:
              print("All data files are fresh.")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh data $(date -u +%Y-%m-%d)"
            git push
          fi
